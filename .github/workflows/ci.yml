name: CI

on:
  push:
    branches: [main, full-application]
  pull_request:

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        # The full requirements set (torch, whisperx, pyannote) is heavyweight
        # and unnecessary here: the server degrades gracefully without the
        # optional stacks, and the tests assert exactly that degraded
        # contract plus all pure-python logic.
        run: |
          pip install fastapi uvicorn pydantic python-dotenv pyyaml requests \
            numpy pytest httpx python-multipart websockets bcrypt \
            "python-jose[cryptography]"
      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude frontend
      - name: Run tests
        run: python -m pytest tests/ -q

  test-frontend:
    name: Frontend type-check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --watchAll=false
      - name: Production build
        run: npm run build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"

  build-and-push:
    name: Build and push images to ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/full-application')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/clinical-ai-backend:${{ github.sha }}" -f Dockerfile .
          docker push "$ECR_REGISTRY/clinical-ai-backend:${{ github.sha }}"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/clinical-ai-frontend:${{ github.sha }}" -f Dockerfile.frontend .
          docker push "$ECR_REGISTRY/clinical-ai-frontend:${{ github.sha }}"

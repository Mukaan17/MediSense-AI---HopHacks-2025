name: CI

on:
  push:
    branches: [main, full-application]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly mutation-testing report

env:
  # Pinned to requirements.txt so the exported OpenAPI schema and test
  # behavior match local dev exactly (an unpinned fastapi could change the
  # generated schema and flake the freshness check).
  BACKEND_LIGHT_DEPS: >-
    fastapi==0.141.1 starlette==1.6.0 uvicorn==0.30.6 pydantic==2.11.4
    python-dotenv pyyaml requests numpy httpx python-multipart websockets
    bcrypt jinja2 prometheus-client python-jose[cryptography]>=3.5.0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '**'
              - '!frontend/**'
            frontend:
              - 'frontend/**'
              - 'openapi.json'
              - '.github/workflows/**'

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        # The full requirements set (torch, whisperx, pyannote) is heavyweight
        # and unnecessary here: the server degrades gracefully without the
        # optional stacks, and the tests assert exactly that degraded
        # contract plus all pure-python logic.
        run: pip install $BACKEND_LIGHT_DEPS pytest pytest-cov hypothesis
      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude frontend
      - name: OpenAPI schema freshness
        # The committed openapi.json is the machine-checked contract; drift
        # between code and schema fails the build.
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json
      - name: Run tests (with coverage ratchet)
        # Floor set from the measured light-set baseline (57%) minus margin
        # for the missing local rag_store; raise deliberately, never lower.
        run: |
          python -m pytest tests/ -q \
            --cov=api --cov=core --cov=rag_runtime --cov-report=term \
            --cov-fail-under=50

  test-frontend:
    name: Frontend type-check, tests, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types freshness
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npx tsc --noEmit
      - run: npm test -- --coverage
      - name: Production build
        run: npm run build

  contract-tests:
    name: API contract fuzz (schemathesis)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend + schemathesis
        run: pip install $BACKEND_LIGHT_DEPS schemathesis
      - name: Start server
        run: |
          APP_MODE=demo python -m uvicorn api.server:app --port 8000 --log-level warning &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
      - name: Fuzz for undocumented server errors
        run: |
          schemathesis run openapi.json --url http://localhost:8000 \
            --checks not_a_server_error --max-examples 15 \
            --suppress-health-check=filter_too_much

  test-e2e:
    name: Playwright E2E smoke
    runs-on: ubuntu-latest
    needs: [changes, test-backend, test-frontend]
    # Runs when either half changed; tolerates the other half's job being
    # skipped by the path filter, but never runs over a failed dependency.
    if: >-
      !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      needs.test-backend.result != 'failure' &&
      needs.test-frontend.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend (light set - server degrades gracefully)
        run: pip install $BACKEND_LIGHT_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (runtime config injected by the E2E server)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (demo mode)
        working-directory: frontend
        run: npx playwright test e2e/demo
      - name: E2E (clinical mode)
        working-directory: frontend
        run: npx playwright test e2e/clinical
        env:
          APP_MODE: clinical

  live-llm-eval:
    name: Live LLM fixture refresh + replay (needs keys)
    runs-on: ubuntu-latest
    # On-demand only: refreshes fixtures against live models when the org
    # has configured API-key secrets, then re-runs the replay tests.
    # Without keys the recording script exits cleanly and replay runs
    # against the committed fixtures.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Record fixtures and replay
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install $BACKEND_LIGHT_DEPS pytest anthropic
          python scripts/record_llm_fixtures.py
          python -m pytest tests/test_llm_replay.py -q
          git diff --stat fixtures/llm/ || true

  mutation-tests:
    name: Mutation testing (report-only)
    runs-on: ubuntu-latest
    # Report-only by design (approved decision D6): informs suite quality
    # without being able to flake CI red. Runs on demand and weekly.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Run mutmut on the parser and chunker
        run: |
          pip install $BACKEND_LIGHT_DEPS pytest hypothesis "mutmut==2.4.5"
          mutmut run --paths-to-mutate core/utils.py \
            --runner "python -m pytest -x -q tests/test_llm_parsing.py" \
            --no-progress || true
          mutmut results || true

  supply-chain:
    name: Dependency audit (blocking)
    runs-on: ubuntu-latest
    # Blocking: both audits fail the build on new findings. The audited
    # Python set is the same light install the tests use, so the
    # security-critical runtime deps (fastapi, starlette, jose, bcrypt)
    # are covered. Accepted findings are ignored by exact ID and triaged
    # in docs/PERF_BASELINE.md ("Supply-chain status") - every new ignore
    # needs a triage entry there.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: pip-audit (installed test set)
        # pip/setuptools are upgraded first so the audit reports on the
        # app's dependencies, not the runner image's bundled tooling.
        # PYSEC-2026-1325: ecdsa Minerva timing attack - transitive of
        # python-jose, no fixed release exists (accepted, see triage doc).
        run: |
          pip install --upgrade pip setuptools
          pip install $BACKEND_LIGHT_DEPS pip-audit
          pip-audit --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (high+)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  build-backend-image:
    name: Build, scan, and push backend image
    runs-on: ubuntu-latest
    needs: [changes, test-backend, contract-tests, test-e2e, supply-chain]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/full-application') &&
      needs.changes.outputs.backend == 'true' &&
      needs.test-backend.result == 'success' &&
      needs.contract-tests.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      needs.supply-chain.result == 'success'
    env:
      # Signing is gated on this secret existing; without it the build
      # still scans, SBOMs, and pushes - it just ships unsigned.
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
      - name: Build backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t "$ECR_REGISTRY/clinical-ai-backend:${{ github.sha }}" -f Dockerfile .
      - name: Scan image (Trivy, blocks on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/clinical-ai-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/clinical-ai-backend:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-sbom.spdx.json
      - name: Push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push "$ECR_REGISTRY/clinical-ai-backend:${{ github.sha }}"
      - name: Install cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        uses: sigstore/cosign-installer@v3
      - name: Sign image by digest (cosign)
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "$ECR_REGISTRY/clinical-ai-backend:${{ github.sha }}")
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$DIGEST"

  build-frontend-image:
    name: Build, scan, and push frontend image
    runs-on: ubuntu-latest
    needs: [changes, test-frontend, test-e2e, supply-chain]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/full-application') &&
      needs.changes.outputs.frontend == 'true' &&
      needs.test-frontend.result == 'success' &&
      needs.test-e2e.result == 'success' &&
      needs.supply-chain.result == 'success'
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t "$ECR_REGISTRY/clinical-ai-frontend:${{ github.sha }}" -f Dockerfile.frontend .
      - name: Scan image (Trivy, blocks on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/clinical-ai-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/clinical-ai-frontend:${{ github.sha }}
          format: spdx-json
          artifact-name: frontend-sbom.spdx.json
      - name: Push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push "$ECR_REGISTRY/clinical-ai-frontend:${{ github.sha }}"
      - name: Install cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        uses: sigstore/cosign-installer@v3
      - name: Sign image by digest (cosign)
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "$ECR_REGISTRY/clinical-ai-frontend:${{ github.sha }}")
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$DIGEST"

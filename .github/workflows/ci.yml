name: Build and Push to Amazon ECR

on:
  push:
    branches: [ full-application ]
#  pull_request:
#    branches: [ full-application ]

# Required for AWS OIDC authentication (Best Practice - No Long-Lived Credentials)
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # REPLACE THESE WITH YOUR ACTUAL AWS DETAILS
        role-to-assume: arn:aws:iam::111122223333:role/GitHubActionsECRRole
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Free up disk space on Runner
      run: |
        # Ubuntu runners often run out of disk space when building huge ML containers.
        # This clears ~30GB of pre-installed software we don't need.
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Build, tag, and push Backend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: clinical-ai-backend
        IMAGE_TAG: ${{ github.sha }} 
      run: |
        # Using Docker Buildx helps with caching and larger builds
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
    - name: Build, tag, and push Frontend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: clinical-ai-frontend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile.frontend .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

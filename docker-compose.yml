# CPU-first stack: works on any laptop. For GPU imaging capacity, layer the
# override:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOGLEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      # Deep reports run on the worker service instead of request workers.
      - FINALIZE_MODE=queue
      # Durable case timeline/snapshots/reports (approved decision D3).
      - CASE_DB_URL=postgresql+psycopg://medisense:medisense@postgres:5432/medisense
      # The nginx frontend serves same-origin, so no extra CORS origin is
      # needed for it; keep localhost for the dev server.
      - FRONTEND_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/app/data
      - ./rag_store:/app/rag_store
      - ./logs:/app/logs
      - model_cache:/app/cache
    depends_on:
      - redis

  # Background jobs (finalize reports) - same image and code as the
  # backend, consuming the shared Redis queue.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    command: ["arq", "worker.settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      - LOGLEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - CASE_DB_URL=postgresql+psycopg://medisense:medisense@postgres:5432/medisense
    volumes:
      - ./data:/app/data
      - ./rag_store:/app/rag_store
      - ./logs:/app/logs
      - model_cache:/app/cache
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=medisense
      - POSTGRES_PASSWORD=medisense
      - POSTGRES_DB=medisense
    volumes:
      - case_db:/var/lib/postgresql/data

volumes:
  model_cache:
  case_db:

# Retrieval configuration. Every key here is consumed by the code:
# - top_k / retrieval.*: core/retriever.py
# - chunking.*: rag_runtime builders (rebuild the KB after changing these)
# - reranker.*: core/retriever.py cross-encoder re-ranking
top_k: 5

chunking:
  enabled: true
  max_words: 180        # ~230 tokens; all-MiniLM-L6-v2 truncates at 256 tokens
  overlap_words: 40

retrieval:
  candidate_k: 20       # FAISS candidates fetched before re-ranking
  final_k: 5

reranker:
  enabled: false        # enabled in P2 (cross-encoder re-ranking)
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

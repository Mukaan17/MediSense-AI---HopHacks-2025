# Prometheus scrape config for the composed stack. Clinical mode gates
# /metrics behind auth: put a long-lived service token in
# observability/secrets/metrics_token (mounted below) or terminate scrape
# auth at a sidecar. Demo mode needs no credentials.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: medisense-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/metrics_token
